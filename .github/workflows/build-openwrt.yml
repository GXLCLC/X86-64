# ==============================================================================
# OpenWrt（LEDE）X86/64 云编译工作流
# ------------------------------------------------------------------------------
# 功能说明：
#   1. 运行环境固定为 Ubuntu 22.04（与官方文档要求的编译环境保持一致）
#   2. 拉取 coolsnowwolf/lede 最新源码，只编译 X86/64 平台
#   3. 内置常用插件：SmartDNS、DDNSTO、AdGuardHome、OFA 应用过滤、Turbo ACC、
#      mwan3 多线负载、Argon 主题（默认主题）、nlbwmon 带宽监控、EasyTier 内网穿透
#   4. 【不包含任何代理插件】，编译过程【不使用 SSH 登录】，全自动完成
#   5. 镜像只产出 IMG（.img.gz）格式，不产出 VMDK/VDI/VHDX/ISO
#   6. overlay（rootfs 分区）预留 2G 空间
#   7. 编译完成后自动发布 GitHub Release，Release 页面包含：
#      LAN IP、后台账号密码、内核版本、固件版本、已安装插件清单（每行一个）
# ==============================================================================

name: 编译 LEDE X86-64 固件

# ------------------------------------------------------------------------------
# 触发条件
# ------------------------------------------------------------------------------
on:
  # 手动触发：在 GitHub 仓库 Actions 页面点击 "Run workflow" 即可编译
  workflow_dispatch:
  # 定时触发：每周五 16:25 UTC（北京时间周六 00:25）自动编译一次，
  # 保证固件能跟上游 LEDE 源码持续更新
  schedule:
    - cron: '25 16 * * 5'
  # 推送到主分支且改动了编译相关文件时自动编译（仅改 README 等不触发，节省资源）
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/build-openwrt.yml'
      - 'scripts/**'
      - 'config/**'
      - 'files/**'
      - 'patches/**'

# ------------------------------------------------------------------------------
# 全局环境变量：把容易变动的信息集中放在这里，方便维护
# ------------------------------------------------------------------------------
env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git   # LEDE 源码仓库地址
  REPO_BRANCH: master                                 # LEDE 源码分支
  CONFIG_FILE: config/x86-64.config                   # X86/64 种子配置文件路径
  LAN_IP: 192.168.1.1                                 # 固件 LAN 管理 IP（写入发布说明）
  LOGIN_USER: root                                    # 后台登录账号（写入发布说明）
  LOGIN_PASS: password                                # 后台登录密码（与 uci-defaults 中设置保持一致）

# GITHUB_TOKEN 默认权限为只读，发布 Release 需要 contents 写权限
permissions:
  contents: write

jobs:
  build:
    name: 编译 X86/64 固件
    # 固定使用 Ubuntu 22.04 编译环境：OpenWrt 官方长期支持的编译环境，
    # 依赖包版本（gcc/binutils/python 等）与 LEDE 源码兼容性最好
    runs-on: ubuntu-22.04
    # 单次编译最长 6 小时（GitHub Actions 单任务上限），超时自动判失败
    timeout-minutes: 360

    steps:
      # ==========================================================================
      # 步骤 1：检出本仓库（拿到 config 种子配置、diy 脚本、自定义 files）
      # ==========================================================================
      - name: 检出本仓库
        uses: actions/checkout@v4

      # ==========================================================================
      # 步骤 2：清理 runner 磁盘空间
      # 原因：GitHub 托管 runner 预装了 .NET、Android SDK、GHC 等大量与编译无关
      #       的软件，根分区可用空间约 15GB；而 OpenWrt 全量编译（源码 + dl
      #       源码包 + build_dir 中间产物）需要 15~20GB，不清理极易中途磁盘写满
      # ==========================================================================
      - name: 清理磁盘空间
        run: |
          echo "==================== 清理前磁盘占用 ===================="
          df -h /
          # 删除与 OpenWrt 编译无关的大块预装软件（不影响后续 actions 组件运行）
          sudo rm -rf /usr/share/dotnet        \
                      /usr/local/lib/android    \
                      /opt/ghc                  \
                      /usr/local/share/boost
          sudo apt-get -y autoremove --purge
          sudo apt-get -y clean
          echo "==================== 清理后磁盘占用 ===================="
          df -h /

      # ==========================================================================
      # 步骤 3：安装 OpenWrt 编译依赖
      # 说明：该依赖清单与 LEDE 官方文档要求一致：
      #   - build-essential/gcc/g++/musl* ：编译工具链
      #   - flex/bison/gawk/gettext       ：源码预处理与本地化
      #   - libncurses-dev/libssl-dev/zlib1g-dev/libelf-dev ：内核与工具依赖
      #   - python3-*                     ：部分包的构建脚本依赖
      #   - subversion                    ：个别老 feed/包使用 svn 拉取
      #   - xsltproc                      ：文档/手册页生成
      # ==========================================================================
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils \
            python3-setuptools rsync swig unzip zip zlib1g-dev file wget \
            xsltproc libelf-dev subversion

      # ==========================================================================
      # 步骤 4：拉取 LEDE 最新源码
      # 说明：--depth=1 只克隆最新一次提交，可大幅减少下载量和磁盘占用；
      #       云编译不需要完整 git 历史。
      # ==========================================================================
      - name: 拉取 LEDE 源码
        run: git clone --depth=1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt

      # ==========================================================================
      # 步骤 5：预处理脚本（换行符/可执行权限）并复制自定义 files
      # 原因：脚本若在 Windows 上编辑过可能带 CRLF 换行符，在 Linux 下执行会
      #       报 /bin/bash^M 错误；这里统一转换为 LF 并赋予可执行权限。
      #       files/ 目录内容会原样覆盖进固件根文件系统（OpenWrt 编译时自动
      #       收集源码根目录下的 files/），用于写入默认配置。
      # ==========================================================================
      - name: 预处理脚本与自定义文件
        run: |
          mkdir -p openwrt/files
          # 转换 diy 脚本换行符并赋予可执行权限
          find scripts -type f -name '*.sh' -exec sed -i 's/\r$//' {} \;
          find scripts -type f -name '*.sh' -exec chmod +x {} \;
          # 转换 files 下脚本换行符（uci-defaults 脚本）
          find files -type f -exec sed -i 's/\r$//' {} \;
          # 复制自定义文件到 OpenWrt 源码的 files/ 目录（编译时打进固件）
          cp -a files/. openwrt/files/

      # ==========================================================================
      # 步骤 6：执行 diy-part1.sh
      # 作用：在 feeds 更新【之前】运行 —— 添加/修改 feeds 源、拉取第三方插件
      #       （DDNSTO 源、Argon 主题、OAF 应用过滤、EasyTier），并注释掉
      #       lean 默认的 helloworld 代理插件 feed（本固件不含任何代理插件）。
      # ==========================================================================
      - name: 执行 diy-part1（添加插件源码）
        run: |
          cd openwrt
          bash ../scripts/diy-part1.sh

      # ==========================================================================
      # 步骤 7：更新并安装 feeds
      # 说明：update = 拉取各 feed 仓库（packages/luci/routing 等）；
      #       install = 在 package/feeds 下建立软件包索引与软链接。
      #       必须在 diy-part1（添加 feed）之后、diy-part2（改 feed 文件）之前。
      # ==========================================================================
      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================================================
      # 步骤 8：执行 diy-part2.sh
      # 作用：在 feeds 安装【之后】运行 —— 修改源码默认设置（把默认主题从
      #       bootstrap 替换为 Argon 等）。
      # ==========================================================================
      - name: 执行 diy-part2（修改默认设置）
        run: |
          cd openwrt
          bash ../scripts/diy-part2.sh

      # ==========================================================================
      # 步骤 9：载入种子配置并生成完整 .config
      # 说明：把仓库 config/x86-64.config 复制为源码 .config（种子文件），
      #       再执行 make defconfig：它会根据 Kconfig 规则自动补全所有依赖项
      #       的默认值（比如选了 luci-app-oaf 会自动选上 appfilter/kmod-oaf），
      #       无需手工逐个挑选依赖。想增减插件，直接编辑 config/x86-64.config 即可。
      # ==========================================================================
      - name: 载入配置并 defconfig
        run: |
          cd openwrt
          cp ../${{ env.CONFIG_FILE }} .config
          make defconfig
          # 在日志中打印已选中的插件，方便核对插件是否都生效
          echo "==================== 已选中的 LuCI 插件/主题 ===================="
          grep -E 'CONFIG_PACKAGE_luci-(app|theme)-' .config | grep '=y' || true

      # ==========================================================================
      # 步骤 10：预下载所有源码包（dl 目录）
      # 原因：把"下载依赖"与"编译"两个阶段分开。先并发把所有源码包拉取完整，
      #       避免编译到一半因网络抖动导致某个包下载失败而整轮编译作废。
      # ==========================================================================
      - name: 下载源码包
        run: |
          cd openwrt
          make download -j"$(nproc)"

      # ==========================================================================
      # 步骤 11：编译固件
      # 说明：-j$(nproc) 按 CPU 核数并发编译以提速；若并发编译失败，自动以
      #       单线程 + V=s（完整日志）重试一遍，便于在 Actions 日志中定位
      #       具体失败原因。
      # 注意：本流程【不接入 tmate/SSH 调试】，编译全程无人值守自动完成。
      # ==========================================================================
      - name: 编译固件
        run: |
          cd openwrt
          make -j"$(nproc)" || {
            echo "==================== 并发编译失败，单线程详细日志重试 ===================="
            make -j1 V=s
          }

      # ==========================================================================
      # 步骤 12：整理编译产物 —— 只保留 IMG 格式
      # 说明：x86 目标默认可能同时产出 .img.gz / .vmdk / .vdi / .vhdx / .iso 等
      #       多种格式；本固件只发布 IMG（.img.gz，含传统 BIOS 与 EFI 两种引导），
      #       这里先物理删除非 IMG 文件做双保险（config 中已关闭对应选项），
      #       并生成 sha256 校验文件。
      # ==========================================================================
      - name: 整理固件产物（仅 IMG）
        run: |
          set -e
          mkdir -p firmware
          # 进入 x86/64 产物目录
          cd openwrt/bin/targets/x86/64
          echo "==================== 编译产物原始列表 ===================="
          ls -lh
          # 物理删除非 IMG 格式，确保发布物只有 IMG
          rm -f *.vmdk *.vdi *.vhdx *.iso
          # 复制 IMG 镜像与 manifest（软件包清单，用于生成发布说明）
          cp -v *.img.gz "$GITHUB_WORKSPACE/firmware/"
          cp -v *.manifest "$GITHUB_WORKSPACE/firmware/" 2>/dev/null || true
          # 生成 sha256 校验和，供下载后校验文件完整性
          cd "$GITHUB_WORKSPACE/firmware"
          sha256sum *.img.gz > sha256sums.txt
          echo "==================== 最终发布文件 ===================="
          ls -lh

      # ==========================================================================
      # 步骤 13：生成 Release 发布说明
      # 内容：固件版本（源码日期+commit）、内核版本、LAN IP、账号密码、
      #       镜像格式说明、已安装插件清单（每个插件单独一行，附版本号）。
      #       插件清单从编译产物 .manifest 中自动提取，保证与实际固件一致。
      # ==========================================================================
      - name: 生成发布说明
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          MANIFEST="$(find openwrt/bin/targets/x86 -name '*.manifest' | head -n1)"
          if [ -z "$MANIFEST" ]; then echo "未找到 manifest 文件！"; exit 1; fi

          # 内核版本：manifest 中 "Package: kernel" 下的 Version 字段
          KERNEL_VER="$(awk '/^Package: kernel$/{f=1;next} f&&/^Version:/{print $2;exit}' "$MANIFEST")"
          # LEDE 源码版本信息：取源码最新提交日期与短 commit 号
          SRC_DATE="$(git -C openwrt log -1 --format=%cd --date=format:'%Y-%m-%d')"
          SRC_SHA="$(git -C openwrt rev-parse --short HEAD)"
          BUILD_DATE="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"

          # 插件清单：提取所有 luci-app-* 与 luci-theme-* 包，每个插件一行（名称+版本）
          # awk 逻辑：遇到 "Package:" 记录包名；遇到 "Version:" 时若包名是 luci 插件则输出一行
          awk '
            /^Package:/ { pkg=$2 }
            /^Version:/ {
              if (pkg ~ /^luci-(app|theme)-/) {
                printf "- %s（版本：%s）\n", pkg, $2
              }
              pkg=""
            }
          ' "$MANIFEST" | sort > plugins.txt
          PLUGIN_COUNT="$(wc -l < plugins.txt)"

          # 生成镜像文件列表（文件名 + 大小）
          IMG_LIST="$(cd firmware && for f in *.img.gz; do echo "- ${f}（$(du -h "$f" | cut -f1)）"; done)"

          cat > firmware/release-notes.md <<EOF
          # LEDE X86/64 云编译固件

          > 本固件由 GitHub Actions 自动编译，仅适用于 X86/64 架构软路由/小主机。

          ## 固件信息

          | 项目 | 内容 |
          |---|---|
          | 固件版本 | LEDE master（源码日期：${SRC_DATE}，提交：${SRC_SHA}） |
          | 编译时间 | ${BUILD_DATE}（北京时间） |
          | 内核版本 | ${KERNEL_VER} |
          | 目标平台 | x86/64（generic） |
          | 镜像格式 | 仅 IMG（.img.gz），包含传统 BIOS 与 EFI 两种引导镜像，**不含 VMDK/VDI/VHDX** |
          | overlay 空间 | rootfs 分区预留 2GiB（可用于安装插件/存放配置的可用空间） |

          ## 后台登录信息

          | 项目 | 内容 |
          |---|---|
          | LAN 管理 IP | ${{ env.LAN_IP }} |
          | 后台地址 | http://${{ env.LAN_IP }} |
          | 登录账号 | ${{ env.LOGIN_USER }} |
          | 登录密码 | ${{ env.LOGIN_PASS }} |

          ## 已安装插件（共 ${PLUGIN_COUNT} 个，每行一个）

          $(cat plugins.txt)

          ## 固件文件

          ${IMG_LIST}

          - sha256sums.txt：镜像 SHA256 校验值

          ## 刷机与使用说明

          1. 下载 `.img.gz` 文件后解压得到 `.img`（部分写盘工具如 balenaEtcher 可直接识别 .gz）；
          2. EFI/UEFI 启动的机器请选择文件名带 **combined-efi** 的镜像；传统 BIOS 选择 **combined** 镜像；
          3. 使用 balenaEtcher / Rufus / physdiskwrite 等工具将 IMG 写入硬盘或电子盘；
          4. 刷机后网线接 LAN 口，浏览器访问 http://${{ env.LAN_IP }} ，使用上表账号密码登录；
          5. 首次进系统建议立即在「系统 - 管理权」修改默认密码。

          ## 自定义编译

          本仓库 \`config/x86-64.config\` 为配置种子文件，可自行增删插件后在 Actions 页面手动触发编译。
          固件**不包含任何代理插件**，编译过程不使用 SSH 登录。
          EOF

          echo "==================== 发布说明预览 ===================="
          cat firmware/release-notes.md

      # ==========================================================================
      # 步骤 14：上传 Artifact 构建产物
      # 作用：即使 Release 发布环节出问题，也能在 Actions 运行页面下载到固件，
      #       保留 30 天，作为双保险。
      # ==========================================================================
      - name: 上传构建产物 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64-firmware
          path: |
            firmware/*.img.gz
            firmware/sha256sums.txt
            firmware/release-notes.md
          retention-days: 30
          if-no-files-found: error

      # ==========================================================================
      # 步骤 15：发布 GitHub Release
      # 说明：tag 用时间戳保证每次发布唯一；固件 IMG 与校验文件、发布说明
      #       一起上传到 Release 页面，用户可直接下载 IMG 使用。
      #       GITHUB_TOKEN 由 Actions 自动注入，无需额外配置 Secret。
      # ==========================================================================
      - name: 发布 Release
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          TAG="LEDE-x86_64-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            firmware/*.img.gz \
            firmware/sha256sums.txt \
            --title "LEDE X86/64 固件 $(TZ=Asia/Shanghai date '+%Y-%m-%d')" \
            --notes-file firmware/release-notes.md \
            --latest
          echo "Release 发布完成：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
