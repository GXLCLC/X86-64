name: 编译 OpenWrt x86_64

on:
  workflow_dispatch:

env:
  # 源码仓库与分支
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  # 编译目标与配置路径
  TARGET: x86_64
  CONFIG_FILE: config/x86_64.config
  FILES_DIR: files
  SCRIPTS_DIR: scripts
  # 固件默认信息（会显示在Release说明中，修改这里同步更新）
  DEFAULT_LAN_IP: 192.168.1.1
  DEFAULT_ROOT_PASSWORD: 空（首次登录无需密码）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-pip unzip zlib1g-dev lib32gcc1 libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler g++-multilib antlr3 gperf wget curl swig rsync

      - name: 克隆 Lede 源码
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

      - name: 更新官方 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行自定义脚本
        run: |
          chmod +x $SCRIPTS_DIR/*.sh
          cd openwrt
          ../$SCRIPTS_DIR/01-add-feeds.sh
          ../$SCRIPTS_DIR/02-customize.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 导入编译配置
        run: |
          cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 整理固件产物
        if: steps.compile.outputs.status == 'success'
        run: |
          mkdir -p output
          cp openwrt/bin/targets/x86/64/* output/ || true

      - name: 生成 Release 说明文档
        if: steps.compile.outputs.status == 'success'
        run: |
          echo "## 📦 固件基本信息" > release.md
          echo "- **架构**: x86_64 通用" >> release.md
          echo "- **源码**: Lean's Lede" >> release.md
          echo "- **LAN 管理地址**: \`${{ env.DEFAULT_LAN_IP }}\`" >> release.md
          echo "- **默认 root 密码**: ${{ env.DEFAULT_ROOT_PASSWORD }}" >> release.md
          echo "" >> release.md
          echo "## 🧩 已启用插件列表" >> release.md
          grep "^CONFIG_PACKAGE_.*=y" openwrt/.config \
            | sed 's/CONFIG_PACKAGE_//' \
            | sed 's/=y//' \
            | sort \
            >> release.md

      - name: 上传 Actions 临时产物
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86_64
          path: output/

      - name: 发布到 GitHub Releases
        if: steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenWrt x86_64 第 ${{ github.run_number }} 次编译
          body_path: release.md
          files: output/*
          generate_release_notes: false
