# ==========================================================================
#  自定义第三方软件源配置文件（custom-feeds.conf）
# --------------------------------------------------------------------------
#  格式说明：
#    每一行是一个 OpenWrt feeds 标准格式的软件源声明：
#      src-git <源名称> <Git仓库地址>
#
#    src-git    = 从 Git 仓库拉取（最常用）
#    源名称     = 给这个源起个唯一名字（不能重复）
#    Git地址    = 标准的 HTTPS Git clone URL
#
#  工作流会自动把本文件的所有内容追加进 lede 源码的 feeds.conf.default，
#  所以你只需要在这里添加/删除源，不需要改工作流 YML。
#
#  注意事项：
#    1) 不要加代理插件的源（helloworld 等）—— 按要求不加任何代理
#    2) 如果你添加的源里某个包不存在，make defconfig 会静默丢弃
#       （工作流里有"校验插件"步骤，丢了会明确报出来）
#    3) EasyTier 和 OpenAppFilter 这两个因为不是标准 feeds 仓库格式，
#       不走这个文件，而是工作流里直接 git clone 到 package/ 目录
# ==========================================================================

# ---------- kenzok8 常用插件源 ----------
# 包含：DDNSTO (ddnsto + luci-app-ddnsto)、以及很多常用小工具
# 这是 lede 社区最常用的第三方插件源之一
src-git kenzok8 https://github.com/kenzok8/openwrt-packages

# ---------- kenzok8 small 补充源 ----------
# kenzok8 把包拆成了两个仓库，small 里有一些依赖库和补充包
# 只加上面的 openwrt-packages 可能不够，两个一起加更稳
src-git small https://github.com/kenzok8/small
